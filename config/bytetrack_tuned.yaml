# ByteTrack, ajustado a partir do default do Ultralytics (achado de campo
# 2026-09-20): track_buffer=30 (~1.2s a 25 FPS) descartava o track e trocava
# de ID a cada oclusao/blur breve — quebrava tanto a confirmacao de ausencia
# de EPI (exige frames consecutivos sob o mesmo ID) quanto o REBA suavizado,
# gerando FALL_RISK falso toda vez que o track "reiniciava". Resto identico
# ao default; so track_buffer sobe.
tracker_type: bytetrack
track_high_thresh: 0.25
track_low_thresh: 0.1
new_track_thresh: 0.25
track_buffer: 90
match_thresh: 0.8
fuse_score: True
