# Phase 2 configuration — loaded via PipelineConfig.from_yaml().
# Keys map 1:1 onto PipelineConfig / ClassifierThresholds fields;
# unknown keys are ignored.

pipeline:
  epi_model_path: models/exp.pt
  pose_model_path: yolo11s-pose.pt   # yolo11n-pose.pt for speed, yolo11m-pose.pt for accuracy
  device: cpu                        # cpu | cuda | mps
  conf_epi: 0.5
  conf_pose: 0.5
  zones_config: config/zones/zones.json
  target_fps: 15.0
  max_latency_ms: 200.0              # if exceeded, EPI stride increases (recovers below 70% of budget)
  epi_stride_max: 4                  # EPI model will not skip more than this many frames

classifier:
  enter_frames: 5                    # consecutive matching frames to confirm a new state
  enter_frames_risk: 2               # faster entry for immediate_risk (recall priority)
  exit_frames: 45                    # consecutive normal frames to leave an alarm state
                                     # (raised 15->45: holds the immediate_risk alarm through the
                                     #  "fallen and still" period; lifted cenario2 recall 0.59->0.99)

thresholds:
  trunk_flexion_deg: 60.0            # NR-17: sustained forward lean beyond this is a risk factor
  spine_load_knee_deg: 150.0         # knee angle above this counts as "straight leg" for spine-load rule
  deep_squat_knee_deg: 90.0          # knee interior angle below this = deep squat
  elevated_arm_deg: 90.0             # shoulder interior angle below this = arm raised above shoulder
  trunk_rotation_max: 0.35           # shoulder/hip offset / bbox_height above this = instability
  fallen_aspect_ratio: 1.3           # bbox width/height above this = person horizontal (side-on lying)
                                     # (restored to a safe 1.3: deep squats no longer trip it; the
                                     #  velocity-independent cues below now carry the sustained-fall recall)
  reba_risk_score: 8                 # REBA final score triggering ergonomically_inadequate
  fall_risk_min: 0.85                # temporal fall_risk_score above this = immediate_risk
                                     # (0.7->0.85: velocity is noisy on fast bends/squats; the cues
                                     #  below carry sustained-fall recall, so velocity can be stricter)
  # Velocity-independent fallen cues — keep the immediate_risk alarm asserted while
  # the person is down and still (the case bbox-aspect + velocity both miss):
  fallen_trunk_deg: 65.0             # trunk flexion from vertical above this = torso horizontal
  fallen_head_hip_offset: 0.0        # (nose_y - hip_y)/bbox_h above this = head at/below hip level
  fallen_body_aspect: 1.1            # torso+leg keypoint horizontal/vertical span above this = lying down

zones:
  approach_buffer_px: 80.0           # buffer around zone boundary for the "approaching" state

notify:
  camera_id: CAM-01
  # Sem api_url, o pipeline apenas imprime os incidentes (comportamento antigo).
  # api_url: http://localhost:8080/api/v1
  # Nome da variavel de ambiente com a chave desta camera (nunca a chave em
  # texto puro aqui — o valor vem do .env do host, gitignorado).
  # api_key_env: CYPHER_KEY_CAM01
  min_severity: 2
  merge_window_seconds: 15            # calibrado em cenario2.mp4 (spec §4.1.2)
  evict_after_frames: 45              # track sumido por N frames = fecha como TRACK_LOST
  min_track_frames: 15                # tracks mais curtos nao abrem incidente
  queue_size: 256
  spill_path: outputs/incidents.jsonl
  stream_port: 8090
  stream_enabled: true

capture:
  rtsp_transport: tcp                 # UDP sob carga gera artefato lido como movimento
  read_timeout_ms: 5000               # declarado como stimeout E timeout (versoes de FFmpeg)
  backoff_base_seconds: 0.5
  backoff_max_seconds: 10
  cache_path: outputs/camera-config-cache.json
